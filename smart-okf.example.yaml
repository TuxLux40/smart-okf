# Copy to smart-okf.yaml (skill root) or ~/.config/smart-okf/smart-okf.yaml and edit.
# Agent onboarding (SKILL.md) writes this file after checking deps and detecting an LLM.
# Env vars override this file: SMART_OKF_<FIELD_NAME> (e.g. SMART_OKF_LLM_MODEL).

document_roots:
  - /path/to/your/documents

# Extractor: local OpenAI-compatible server the *script* calls (not the orchestrating agent).
llm_host: http://127.0.0.1:1234
llm_model: gemma-4-e4b-it-qat

# Optional: vision-capable model on the same host for standalone images (handwriting + scene).
# vision_model: qwen3-vl-2b-instruct

# Layout-aware PDF backend via external `marker_single` CLI (pipx install marker-pdf).
# Not a pip dependency of this repo. Set false / pass --no-marker to use pdfplumber+OCRmyPDF only.
# use_marker: true
